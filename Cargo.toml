[workspace]
resolver = "2"
members = ["core", "cli", "wasm", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The WebAssembly build favours small size: it is inlined into the page.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
